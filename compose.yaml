services:
  db:
    # Same reference as the CI service container (.github/workflows/ci.yml); change both together.
    image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 keeps its data in /var/lib/postgresql/18/docker; a Postgres 17 volume cannot start here.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hermes"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres18_data:
