# What this runs and how to reproduce it locally: docs/testing.md#ci
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Master pushes get one group per commit, because a shared
# group would still cancel a pending run; so every merged commit gets a verdict.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Production runs Railway's postgres-ssl:18; pinned to the postgres:18 index digest.
        # compose.yaml uses the same reference; change both together.
        image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_DB: hermes_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hermes_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hermes_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi

      # The committed *_templ.go must be what the pinned templ generates. Intent-to-add lets the diff see new files;
      # diffing against HEAD, not the index, also sees an orphaned *_templ.go that generate deleted.
      - name: templ generate
        run: |
          go tool templ generate
          git add --intent-to-add .
          git diff --exit-code HEAD

      # -fail exits non-zero when any .templ file is not as templ fmt would write it.
      - name: templ fmt
        run: go tool templ fmt -fail .

      - name: go vet
        run: go vet -tags=integration ./...

      - name: go build
        run: go build ./...

      - name: go test (race, integration)
        run: go test -race -tags=integration -count=1 ./...

      # The scanners run even after an earlier step fails, so every run reports them.
      - name: govulncheck
        if: ${{ !cancelled() }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -tags=integration -test ./...

      # Report only: findings are triaged by hand, so they never fail the run; a warning puts them on the run page.
      - name: gosec (report only)
        if: ${{ !cancelled() }}
        run: |
          if ! go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet -tags=integration ./...; then
            echo "::warning title=gosec::gosec reported findings (or failed); see the gosec step log"
          fi
